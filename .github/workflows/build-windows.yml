name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - name: Build one-file Windows executable
        run: >
          pyinstaller --onefile --windowed
          --name "BreakthroughCalculator"
          --icon packaging/breakthrough-calc.ico
          --add-data "data/breakthrough.json;data"
          --add-data "data/pill_effect_sources.json;data"
          --add-data "packaging/breakthrough-calc.png;."
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "dist/BreakthroughCalculator.exe"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: BreakthroughCalculator-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach builds to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/BreakthroughCalculator.exe
            artifacts/linux/BreakthroughCalculator-x86_64.AppImage
