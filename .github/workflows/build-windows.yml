name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        name: Decide release tag (auto-release on version bump)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP '__version__ = "\K[^"]+' breakthrough_calc/__init__.py)
            tag="v$v"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-windows:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "PySide6==6.11.1" "pyinstaller==6.21.0"
      - name: Build one-file Windows executable
        run: >
          pyinstaller --onefile --windowed
          --name "BreakthroughCalculator"
          --icon packaging/breakthrough-calc.ico
          --add-data "data;data"
          --add-data "packaging/breakthrough-calc.png;."
          main.py
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: "dist/BreakthroughCalculator.exe"

  build-linux:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: BreakthroughCalculator-x86_64.AppImage

  release:
    needs: [version, build-windows, build-linux]
    if: ${{ needs.version.outputs.release == 'true' && !contains(needs.version.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach builds to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/windows/BreakthroughCalculator.exe
            artifacts/linux/BreakthroughCalculator-x86_64.AppImage
