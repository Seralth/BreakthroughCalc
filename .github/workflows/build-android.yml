name: Build Android

# Master pushes are path-gated on pubspec.yaml (which every version bump
# touches, per the release checklist); path filters don't apply to tag
# pushes, so v* tags always build. The version job auto-creates the
# vX.Y release on the first push of a new version — no manual tag needed.
on:
  push:
    branches: [master]
    paths: ["mobile/pubspec.yaml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        name: Decide release tag (auto-release on version bump)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP '__version__ = "\K[^"]+' breakthrough_calc/__init__.py)
            tag="v$v"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-apk:
    needs: [test, version]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
      - name: Sync data tables into assets
        run: ./sync_data.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify engine parity with the Python engine
        run: |
          python3 test/gen_expected.py
          dart run test/parity.dart
      - name: Write release signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WILL_RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=omvault"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "Release keystore configured."
          elif [[ "$GITHUB_REF" == refs/tags/* || "$WILL_RELEASE" == "true" ]]; then
            echo "::error::Release build without ANDROID_KEYSTORE_* secrets — refusing to publish a debug-signed APK (updates would break for every user)."
            exit 1
          else
            echo "No keystore secrets — APK will be debug-signed (non-release build)."
          fi
      - name: Build release APK
        run: flutter build apk --release --dart-define=BUILD_STAMP="${GITHUB_SHA:0:7} · $(date -u +%Y-%m-%d)"
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk BreakthroughCalculator.apk
      - name: Verify and report APK signer certificate
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs BreakthroughCalculator.apk
      - uses: actions/upload-artifact@v5
        with:
          name: BreakthroughCalculator-apk
          path: mobile/BreakthroughCalculator.apk
      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || needs.version.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: mobile/BreakthroughCalculator.apk
          generate_release_notes: ${{ !contains(needs.version.outputs.tag, '-') }}
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          body: ${{ contains(needs.version.outputs.tag, '-') && 'Android app — BETA. Sideload BreakthroughCalculator.apk (enable "install from unknown sources"). Desktop builds are unchanged from the latest stable release.' || '' }}
