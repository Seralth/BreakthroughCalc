name: Build Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
      - name: Sync data tables into assets
        run: ./sync_data.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify engine parity with the Python engine
        run: |
          python3 test/gen_expected.py
          dart run test/parity.dart
      - name: Write release signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=omvault"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "Release keystore configured."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Tag build without ANDROID_KEYSTORE_* secrets — refusing to publish a debug-signed APK (updates would break for every user)."
            exit 1
          else
            echo "No keystore secrets — APK will be debug-signed (non-release build)."
          fi
      - name: TEMP sig-test keystore (revert before merge)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/sigtest.jks" -storepass sigtest123 -keypass sigtest123 -alias omvault -keyalg RSA -dname "CN=sigtest" -validity 30
          {
            echo "storeFile=$RUNNER_TEMP/sigtest.jks"
            echo "storePassword=sigtest123"
            echo "keyAlias=omvault"
            echo "keyPassword=sigtest123"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release --dart-define=BUILD_STAMP="${GITHUB_SHA:0:7} · $(date -u +%Y-%m-%d)"
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk BreakthroughCalculator.apk
      - name: Verify and report APK signer certificate
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs BreakthroughCalculator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BreakthroughCalculator-apk
          path: mobile/BreakthroughCalculator.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/BreakthroughCalculator.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ contains(github.ref_name, '-') && 'Android app — BETA. Sideload BreakthroughCalculator.apk (enable "install from unknown sources"). Desktop builds are unchanged from the latest stable release.' || '' }}
