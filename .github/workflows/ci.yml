name: CI

# The full test suite: Python engine/logic tests, Flutter analyze + tests,
# and the Python<->Dart engine parity check. Runs on every branch push and is
# reused (workflow_call) as the gate for all build/deploy workflows — nothing
# builds or deploys from a commit that fails these.

on:
  push:
    branches-ignore: [master]  # master runs it via the build/deploy workflows
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python engine + logic tests
        run: |
          pip install pytest
          pytest -q
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
      - name: Flutter analyze + tests
        working-directory: mobile
        run: |
          ./sync_data.sh
          flutter pub get
          flutter analyze
          flutter test
      - name: Engine parity (Python <-> Dart)
        working-directory: mobile
        run: |
          python3 test/gen_expected.py
          dart run test/parity.dart
